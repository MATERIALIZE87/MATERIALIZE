<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Map Painter Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>Map Painter</h1>

    <section>
      <h2>Mapa</h2>
      <label class="btn">Cargar otra imagen<input type="file" id="mapFile" accept="image/*" hidden></label>
      <button id="demoBtn">Recargar mapa Balcanes</button>
      <label>Umbral de líneas <span id="thrVal">135</span>
        <input type="range" id="thr" min="20" max="230" value="135"></label>
      <button id="redetect">Re-detectar provincias</button>
      <label>Estilo
        <select id="mode">
          <option value="relief">Relieve Táctico (ve blancos y sombras)</option>
          <option value="flat">Colores planos + líneas encima</option>
        </select></label>
      <label>Opacidad del color <input type="range" id="opacity" min="10" max="100" value="85"></label>
    </section>

    <section>
      <h2>Herramientas</h2>
      <div id="tools">
        <button data-tool="fill" class="on" title="F">Asignar prov.</button>
        <button data-tool="unown" title="U">Desasignar</button>
        <button data-tool="group" title="G">Agrupar (Clic/Lazo)</button>
        <button data-tool="ungroup" title="H">Desagrupar</button>
        <button data-tool="split" title="S">Dibujar Frontera</button>
        <button data-tool="pick" title="P">Clonar color</button>
        <button data-tool="text" title="T">Añadir Texto</button>
        <button data-tool="image" title="I">Añadir Imagen</button>
        <button data-tool="moveItem" title="V">Mover Elem.</button>
        <button data-tool="pan" title="Espacio o Rueda = Mover">Mover Mapa</button>
      </div>
      
      <!-- Controles para Textos e Imágenes en el mapa -->
      <div id="itemControls" style="margin-top:8px; padding-top:6px; border-top:1px dashed #2c3038;">
        <label>Texto / Etiqueta: <input type="text" id="mapTextInput" placeholder="Ej. Belgrado"></label>
        <div class="row">
          <label style="flex:1">Tam. / Escala <input type="number" id="itemSize" value="22" min="6" max="400"></label>
          <label>Color <input type="color" id="itemColor" value="#ffffff"></label>
        </div>
        <input type="file" id="itemImgFile" accept="image/*" hidden>
      </div>
    </section>

    <section>
      <h2>Base de Datos de Países</h2>
      <label>Continente:
        <select id="continentSelect"></select>
      </label>
      <label>País:
        <select id="countrySelect"></select>
      </label>
      <button id="addDbCountryBtn" class="btn-primary">+ Añadir al mapa</button>
    </section>

    <section>
      <h2>Países Activos</h2>
      <div id="countries"></div>
      <button id="addCountry">+ Añadir país personalizado</button>
    </section>

    <section>
      <h2>Guerra Rápida</h2>
      <label>Atacante <select id="warA"></select></label>
      <label>Defensor <select id="warB"></select></label>
      <div class="row">
        <button id="warApply">Rojo vs Azul</button>
        <button id="warSwap">Invertir</button>
      </div>
    </section>

    <section>
      <h2>Proyecto</h2>
      <div class="row">
        <button id="undoBtn">Deshacer</button>
        <button id="redoBtn">Rehacer</button>
      </div>
      <button id="exportPng">Exportar fotograma (PNG)</button>
      <button id="savePrj">Guardar proyecto (.json)</button>
      <label class="btn">Cargar proyecto<input type="file" id="loadPrj" accept=".json" hidden></label>
    </section>
  </aside>

  <main>
    <div id="view">
      <div id="stage"><canvas id="main"></canvas></div>
      <!-- Menú Contextual Clic Derecho -->
      <div id="ctxMenu" class="ctx-menu" hidden></div>
    </div>
    <div id="timeline">
      <div id="kfList"></div>
      <div class="tlrow">
        <button id="kfAdd">+ Fotograma (Keyframe)</button>
        <button id="kfUpdate">Actualizar seleccionado</button>
        <button id="kfLeft">◀</button>
        <button id="kfRight">▶</button>
        <button id="kfDel">Eliminar</button>
        <label>Pausa (s) <input type="number" id="hold" value="2" min="0" step="0.5"></label>
        <label>Transición (s) <input type="number" id="trans" value="1.5" min="0" step="0.5"></label>
      </div>
      <div class="tlrow">
        <label>Fecha/Título <input type="text" id="caption" placeholder="ej. Noviembre 2027"></label>
        <label>Tamaño <input type="number" id="capSize" value="56" min="10" max="300"></label>
        <label>Posición <select id="capPos"><option value="bottom">Abajo</option><option value="top">Arriba</option></select></label>
        <button id="playBtn">▶ Previsualizar</button>
        <button id="recBtn">● Grabar video</button>
        <button id="stopBtn">■ Detener</button>
        <span id="status"></span>
      </div>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
