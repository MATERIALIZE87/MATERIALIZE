<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Map Painter Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>Map Painter</h1>

    <section>
      <h2>Mapa</h2>
      <label class="btn">Cargar mi imagen de mapa<input type="file" id="mapFile" accept="image/*" hidden></label>
      <button id="demoBtn">Cargar mapa de prueba</button>
      <label>Umbral de líneas <span id="thrVal">110</span>
        <input type="range" id="thr" min="20" max="230" value="110"></label>
      <button id="redetect">Re-detectar provincias</button>
      <label>Estilo
        <select id="mode">
          <option value="multiply">Tinte (conserva relieve y sombras)</option>
          <option value="flat">Colores planos + líneas encima</option>
        </select></label>
      <label>Opacidad del color <input type="range" id="opacity" min="10" max="100" value="100"></label>
    </section>

    <section>
      <h2>Herramientas</h2>
      <div id="tools">
        <button data-tool="fill" class="on" title="F">Asignar prov.</button>
        <button data-tool="unown" title="U">Desasignar</button>
        <button data-tool="pick" title="P">Clonar color</button>
        <button data-tool="brush" title="B">Pincel</button>
        <button data-tool="eraser" title="E">Borrador</button>
        <button data-tool="pan" title="Space = Mover">Mover (Pan)</button>
      </div>
      <label>Tamaño pincel <input type="range" id="brushSize" min="2" max="150" value="24"></label>
      <label>Color pincel <input type="color" id="brushColor" value="#c0392b"></label>
      <label class="chk"><input type="checkbox" id="lockBrush"> Mantener pincel dentro de la provincia</label>
    </section>

    <!-- NUEVA SECCIÓN: Base de datos de Países -->
    <section>
      <h2>Base de Datos de Países</h2>
      <label>Continente:
        <select id="continentSelect"></select>
      </label>
      <label>País:
        <select id="countrySelect"></select>
      </label>
      <button id="addDbCountryBtn" class="btn-primary">+ Añadir al mapa</button>
    </section>

    <section>
      <h2>Países Activos</h2>
      <div id="countries"></div>
      <button id="addCountry">+ Añadir país personalizado</button>
    </section>

    <section>
      <h2>Guerra Rápida</h2>
      <label>Atacante <select id="warA"></select></label>
      <label>Defensor <select id="warB"></select></label>
      <div class="row">
        <button id="warApply">Rojo vs Azul</button>
        <button id="warSwap">Invertir</button>
      </div>
    </section>

    <section>
      <h2>Proyecto</h2>
      <div class="row">
        <button id="undoBtn">Deshacer</button>
        <button id="redoBtn">Rehacer</button>
      </div>
      <button id="exportPng">Exportar fotograma (PNG)</button>
      <button id="savePrj">Guardar proyecto (.json)</button>
      <label class="btn">Cargar proyecto<input type="file" id="loadPrj" accept=".json" hidden></label>
    </section>
  </aside>

  <main>
    <div id="view"><div id="stage"><canvas id="main"></canvas></div></div>
    <div id="timeline">
      <div id="kfList"></div>
      <div class="tlrow">
        <button id="kfAdd">+ Fotograma (Keyframe)</button>
        <button id="kfUpdate">Actualizar seleccionado</button>
        <button id="kfLeft">◀</button>
        <button id="kfRight">▶</button>
        <button id="kfDel">Eliminar</button>
        <label>Pausa (s) <input type="number" id="hold" value="2" min="0" step="0.5"></label>
        <label>Transición (s) <input type="number" id="trans" value="1.5" min="0" step="0.5"></label>
      </div>
      <div class="tlrow">
        <label>Texto <input type="text" id="caption" placeholder="ej. Noviembre 2027"></label>
        <label>Tamaño <input type="number" id="capSize" value="56" min="10" max="300"></label>
        <label>Posición <select id="capPos"><option value="bottom">Abajo</option><option value="top">Arriba</option></select></label>
        <button id="playBtn">▶ Previsualizar</button>
        <button id="recBtn">● Grabar video</button>
        <button id="stopBtn">■ Detener</button>
        <span id="status"></span>
      </div>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
